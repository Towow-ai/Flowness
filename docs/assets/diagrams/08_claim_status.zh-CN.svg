<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720" version="1.1" viewBox="0 0 1280 720" width="1280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F4EE" height="720" width="1280" x="0" y="0" /><text fill="#D66A4A" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="750" opacity="1" text-anchor="start" x="64" y="68">公开主张</text><text fill="#19232D" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="42" font-weight="780" opacity="1" text-anchor="start" x="64" y="115">准确说出什么已经真实存在</text><rect fill="#E4F0EC" height="82" opacity="1" rx="20" ry="20" stroke="#4F8A78" stroke-width="2" width="1040" x="120" y="170" /><text fill="#4F8A78" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="800" opacity="1" text-anchor="start" x="160" y="204">[RUNNABLE]</text><text fill="#66707A" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="160" y="232">可从公开 Release 干净复现</text><rect fill="#E7ECFA" height="82" opacity="1" rx="20" ry="20" stroke="#536FCE" stroke-width="2" width="1040" x="120" y="265" /><text fill="#536FCE" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="800" opacity="1" text-anchor="start" x="160" y="299">[INSPECTABLE]</text><text fill="#66707A" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="160" y="327">有公开代码、测试或合同</text><rect fill="#F4E2DB" height="82" opacity="1" rx="20" ry="20" stroke="#D66A4A" stroke-width="2" width="1040" x="120" y="360" /><text fill="#D66A4A" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="800" opacity="1" text-anchor="start" x="160" y="394">[DOGFOOD]</text><text fill="#66707A" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="160" y="422">长期私有实践或观测</text><rect fill="#F3E9D3" height="82" opacity="1" rx="20" ry="20" stroke="#C89B45" stroke-width="2" width="1040" x="120" y="455" /><text fill="#C89B45" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="800" opacity="1" text-anchor="start" x="160" y="489">[DESIGNED]</text><text fill="#66707A" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="160" y="517">已经设计，但尚未端到端接通</text><rect fill="#F4E3E1" height="82" opacity="1" rx="20" ry="20" stroke="#B85C57" stroke-width="2" width="1040" x="120" y="550" /><text fill="#B85C57" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="800" opacity="1" text-anchor="start" x="160" y="584">[OPEN QUESTION]</text><text fill="#66707A" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="160" y="612">研究目标，不是能力</text><text fill="#66707A" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="middle" x="640" y="680">任何精美的页面，都不能把主张升级到 Release 绑定证据之上。</text></svg>